<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>JOB</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --pri:#1f3a5f; --pri2:#2c5282; --acc:#f2b705; --bg:#f3f5f8; --card:#fff; --ink:#1c2430; --mut:#6b7684; --line:#e3e7ec;
  --g:#1e9e5a; --gbg:#e5f6ec; --y:#b88600; --ybg:#fdf4d6; --r:#d23c3c; --rbg:#fbe6e6; --gr:#9aa3ad;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:90px}
header.top{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;display:flex;align-items:center;gap:8px;padding:12px 12px;padding-top:calc(12px + env(safe-area-inset-top))}
header.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px}
header.top .ib{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;min-width:40px;height:40px;font-size:18px;cursor:pointer}
.wrap{padding:14px 14px}
.card{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(20,30,50,.07);margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--pri2);display:flex;align-items:center;gap:8px}
.card h3 .cnt{margin-left:auto;background:var(--bg);color:var(--mut);border-radius:20px;padding:1px 9px;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:0;border-radius:14px;padding:14px 6px 12px;box-shadow:0 1px 3px rgba(20,30,50,.08);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-weight:600;font-size:12px;color:var(--pri);text-align:center;min-height:86px;justify-content:center}
.tile .ic{font-size:26px;line-height:1}
.tile:active{transform:scale(.97)}
.tile.close{background:var(--pri);color:#fff}
.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer}
.btn.sec{background:#e8edf3;color:var(--pri)}
.btn.ok{background:var(--g)} .btn.warn{background:var(--y)} .btn.del{background:var(--r)}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%;display:block}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center}
.row.wrapw{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mut{color:var(--mut);font-size:13px}
.empty{color:var(--mut);font-size:13px;padding:6px 0;font-style:italic}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=time],input[type=search],textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,textarea:focus{border-color:var(--pri2)}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.4px}
label.f b{color:var(--r)}
.list .it{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.it .t{font-weight:600}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#e8edf3;color:var(--pri);letter-spacing:.3px;white-space:nowrap}
.b-app{background:#e3ecf9;color:#24508f} .b-tel{background:#e6f4f1;color:#1b7a66} .b-evt{background:#f1e8fb;color:#6b3aa6}
.b-done{background:var(--gbg);color:var(--g)} .b-wait{background:var(--ybg);color:var(--y)} .b-rip{background:#eceff3;color:var(--mut)}
.b-pro{background:var(--acc);color:#3b2d00}
.time{font-variant-numeric:tabular-nums;font-weight:700;color:var(--pri);min-width:44px}
.link{color:var(--pri2);font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.tabs button{border:0;border-radius:10px;padding:10px 2px;background:#e8edf3;color:var(--pri);font-weight:700;font-size:12px;cursor:pointer}
.tabs button.on{background:var(--pri);color:#fff}
.arr{width:14px;color:var(--mut);flex:none;font-size:13px}
.pbox h3{font-size:14px;color:var(--pri);border-bottom:2px solid var(--acc);padding-bottom:8px}
.pbox h3 .pill{margin-left:auto}
.tabs button.fix{background:var(--acc);color:#3b2d00}
.seg{display:flex;background:#e8edf3;border-radius:10px;padding:3px;margin:10px 0}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;color:var(--pri);cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px}
.kv div:nth-child(odd){color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.4px;padding-top:2px}
.kv a{color:var(--pri2)}
ul.bul{margin:0;padding-left:0;list-style:none}
ul.bul li{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
ul.bul li:last-child{border-bottom:0}
ul.bul li .dot{width:7px;height:7px;border-radius:50%;background:var(--pri2);margin-top:7px;flex:none}
.icb{border:0;background:#eef2f6;border-radius:8px;width:34px;height:34px;cursor:pointer;flex:none;font-size:15px}
.note{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fff}
.note.wait{border-left:4px solid var(--y)}
.note.done{border-left:4px solid var(--g)}
.note.rip{border-left:4px solid var(--gr)}
.note.app0{border-left:4px solid var(--pri2)}
.note .hd{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.note .dt{font-weight:700}
.note .op{margin-left:auto;display:flex;gap:6px}
.note p{margin:4px 0;white-space:pre-wrap}
.note .lab{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.crumb{font-size:13px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumb span{color:var(--pri2);font-weight:600;cursor:pointer}
.prod{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.prod:last-child{border-bottom:0}
.prod .nm{font-weight:700;flex:1}
.s-g{color:var(--g)} .s-y{color:var(--y)} .s-r{color:var(--r)} .s-n{color:var(--gr)}
.pill{display:inline-flex;gap:3px;font-size:11px;font-weight:700}
.pill i{font-style:normal;border-radius:10px;padding:1px 6px}
.pill .pg{background:var(--gbg);color:var(--g)} .pill .py{background:var(--ybg);color:var(--y)} .pill .pr{background:var(--rbg);color:var(--r)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:currentColor}
.week .day{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.week .day:last-child{border-bottom:0}
.week .dn{width:48px;text-align:center;flex:none}
.week .dn b{display:block;font-size:20px;color:var(--pri)}
.week .dn small{text-transform:uppercase;color:var(--mut);font-size:11px;font-weight:700}
.week .day.today .dn b{background:var(--pri);color:#fff;border-radius:10px}
.week .items{flex:1;display:flex;flex-direction:column;gap:3px;font-size:13px;min-width:0}
.week .items div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#eef2f6;border-radius:20px;padding:5px 6px 5px 11px;font-size:13px;font-weight:600}
.chip button{border:0;background:rgba(0,0,0,.08);border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1}
.crit{border-left:4px solid var(--gr)}
.crit.cg{border-left-color:var(--g)} .crit.cy{border-left-color:var(--y)}
.alert{color:var(--r);font-weight:800}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:calc(100% - 28px);max-width:612px;z-index:4;box-shadow:0 4px 14px rgba(20,40,80,.25);padding:14px;font-size:16px}
.banner{border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:14px;display:flex;gap:10px;align-items:center}
.banner.y{background:var(--ybg);color:#6b4f00} .banner.r{background:var(--rbg);color:#8a1f1f}
.taskbtn{display:flex;align-items:center;width:100%;border:0;background:#fff;border-radius:12px;padding:15px;margin-bottom:10px;box-shadow:0 1px 3px rgba(20,30,50,.08);font-weight:700;font-size:16px;color:var(--pri);cursor:pointer;text-align:left}
.taskbtn .n{margin-left:auto;background:var(--pri);color:#fff;border-radius:20px;min-width:30px;padding:3px 9px;text-align:center;font-size:14px}
.taskbtn .n.z{background:#e8edf3;color:var(--mut)}
.task{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.task:last-child{border-bottom:0}
.task .chk{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:#fff;flex:none;cursor:pointer;font-size:16px;color:#fff}
.task.done .chk{background:var(--g);border-color:var(--g)}
.task.done .tt{text-decoration:line-through;color:var(--mut)}
.task .tt{font-weight:600;white-space:pre-wrap}
.task .ds{font-size:12px;color:var(--mut);margin-top:3px}
.due-soon{color:var(--y);font-weight:700} .due-late{color:var(--r);font-weight:700}
/* modali */
.ov{position:fixed;inset:0;background:rgba(15,25,40,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet.anim{animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 4px;font-size:18px;color:var(--pri);display:flex;align-items:center;gap:8px}
.sheet h2 .x{margin-left:auto;border:0;background:#e3e8ee;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:120px}
.choice{display:grid;gap:10px;margin-top:10px}
.choice .btn{padding:15px;font-size:16px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1c2430;color:#fff;padding:10px 16px;border-radius:10px;z-index:40;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#toast.on{opacity:1}
.pick .prod{padding:10px 4px}
.cb{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;background:#fff;color:transparent}
.cb.on{background:var(--pri);border-color:var(--pri);color:#fff}
.go{color:var(--mut);font-size:20px;padding:0 6px}
.res .it{align-items:flex-start}
</style>
</head>
<body>
<div id="app"></div>
<div id="modals"></div>
<div id="toast"></div>
<input type="file" id="fileImp" accept="application/json,.json" hidden>

<script>
'use strict';
/* =====================================================================
   ELENCO PRODOTTI (dal file PRODOTTI_CRAT)
   Per aggiungere/modificare prodotti basta cambiare questo elenco.
   ===================================================================== */
const PRODUCTS = [
  // 4 box: prodotti dalla prima parte del file; sottoprodotti dalla seconda parte
  {n:'CREDITO', c:[
    {n:'ERBAVOGLIO'},{n:'FIDO PRIVATI'},{n:'CASANOVA'},{n:'MUTUO AZIENDA'},{n:'IPO'},
    {n:'FIDO AZ CASSA'},{n:'FIDO AZ SBF/AFI'},{n:'FIDO AZ ESTERO'},{n:'CDR'},{n:'CREDITO DI FIRMA'},{n:'MUTUO AZ CHIRO'}
  ]},
  {n:'ASSICURAZIONI', c:[
    {n:'RCA', c:[{n:'GROUPAMA'},{n:'NOBIS'},{n:'HELVETIA'}]},
    {n:'VITA', c:[{n:'STILE LIBERO'},{n:'STILE LIBERO BUSINESS'},{n:'KEY CAPITAL'},{n:'DOPPIA VITA'},{n:'MUTUO PROTETTO'},{n:"MUTUO PROTETTO PIU'"},{n:'FINANZIAMENTO PROTETTO'},{n:"FINANZIAMENTO PROTETTO PIU'"},{n:'COPERTURA ERBAVOGLIO'}]},
    {n:'AZIENDA', c:[{n:'INCENDIO'},{n:'RCT/RCO'},{n:'CATASTROFALI'},{n:'D&O'},{n:'POSTUMA/CAR'}]},
    {n:'CASA', c:[{n:'INCENDIO', c:[{n:'NET CASA'},{n:'NET INCENDIO'}]},{n:'RC CAPOFAMIGLIA'}]},
    {n:'INFORTUNI', c:[{n:'FULL'},{n:"MOBILITA'"}]},
    {n:'CREDITO'},
    {n:'PIANO PENSIONE', c:[{n:'SOLUZIONE PREVIDENTE'}]},
    {n:'SALUTE', c:[{n:'SALUTISSIMA', c:[{n:'SILVER'},{n:'GOLD'},{n:'PLATINUM'},{n:'SENIOR'}]}]}
  ]},
  {n:'INVESTIMENTI', c:[
    {n:'TIME DEPOSIT'},
    {n:'FONDI', c:[{n:'PAC'},{n:'PIC'},{n:'PIR'}]},
    {n:'GESTIONI PATRIMONIALI', c:[{n:'CLASSIC'},{n:'TRAINER'},{n:'MULTILINEA'}]},
    {n:'AMMINISTRATO', c:[{n:'AZIONI'},{n:'OBBLIGAZIONI'},{n:'TITOLI DI STATO'},{n:'ETF'}]},
    {n:'ASSICURAZIONI'},{n:"LIQUIDITA'"},{n:'CERTIFICATE'},{n:'OBBLIGAZIONI'}
  ]},
  {n:'SERVIZI', c:[
    {n:'CONTO CORRENTE'},{n:'BANCOMAT'},{n:'CARTA DI CREDITO'},{n:'HOME BANKING'},{n:'TELEPASS'},{n:'CASSA CONTINUA'}
  ]}
];
const P = {}; // id -> nodo
(function idx(list, parent){
  list.forEach(n=>{
    n.id = parent ? parent.id+' > '+n.n : n.n;
    n.p = parent || null;
    P[n.id] = n;
    if(n.c) idx(n.c, n);
  });
})(PRODUCTS, null);
function leaves(n){ return n.c ? n.c.flatMap(leaves) : [n]; }
function pathLabel(id){ return id.split(' > ').join(' › '); }

/* ===================== DATI (solo sul telefono) ===================== */
const KEY = 'job_db_v1';
let db;
function blank(){ return {clients:[], events:[], collabs:[], searches:[], meta:{lastBackup:null, created:today()}}; }
function load(){
  try{ db = JSON.parse(localStorage.getItem(KEY)) || blank(); }catch(e){ db = blank(); }
  const b = blank(); for(const k in b) if(db[k]==null) db[k]=b[k];
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ alertBox('Errore di salvataggio: memoria del telefono piena? Esegui subito un Export.'); }
}
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ===================== UTILITÀ ===================== */
const pad = n => String(n).padStart(2,'0');
function ds(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function today(){ return ds(new Date()); }
function parse(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parse(s); d.setDate(d.getDate()+n); return ds(d); }
function diffDays(a,b){ return Math.round((parse(a)-parse(b))/86400000); }
function fd(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return d+'/'+m+'/'+y; }
function fds(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return d+'/'+m; }
const GG = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
const GGL = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
const MM = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
function fdl(s){ const d=parse(s); return GGL[d.getDay()]+' '+d.getDate()+' '+MM[d.getMonth()]; }
function monday(s){ const d=parse(s); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return ds(d); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function q(s){ return "'"+String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'"; } // argomento sicuro per onclick
const $ = id => document.getElementById(id);
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),2200); }
const TYPE = {app:'APPUNTAMENTO', tel:'CONTATTO', evt:'EVENTO'};
const client = id => db.clients.find(c=>c.id===id);
const event_ = id => db.events.find(e=>e.id===id);
function cname(c){ return c ? (c.cognome+' '+(c.nome||'')).trim() : '—'; }
function sortEv(a,b){ return (a.date+(a.time||'99:99')).localeCompare(b.date+(b.time||'99:99')); }
function evOf(date){ return db.events.filter(e=>e.date===date).sort(sortEv); }
function pendingPast(){ return db.events.filter(e=>e.type!=='evt' && e.status==='open' && e.date<today()).sort(sortEv); }

/* ===================== NAVIGAZIONE (tasto indietro Android) ===================== */
let stack = [{v:'home'}];
let modals = []; // {html, locked, onClose}
function cur(){ return stack[stack.length-1]; }
function go(v, p){ closeAllModals(true); stack.push(Object.assign({v}, p||{})); history.pushState({d:stack.length},''); render(); window.scrollTo(0,0); }
function back(){ history.back(); }
function setP(p){ Object.assign(cur(), p); render(); }
let extraHist = 0; // voci di cronologia extra usate per bloccare il tasto indietro
window.addEventListener('popstate', ()=>{
  if(!modals.length && extraHist>0){ extraHist--; return; }
  if(modals.length){
    const top = modals[modals.length-1];
    history.pushState({d:stack.length},'');
    if(!top.locked) closeModal();
    return;
  }
  if(stack.length>1){ stack.pop(); render(); }
});

function render(){
  const s = cur(); const V = VIEWS[s.v] || VIEWS.home;
  $('app').innerHTML = V(s);
  if(s.v==='clients') drawClientList();
  const af = $('app').querySelector('[data-af]'); if(af) af.focus();
}
function hdr(title, opts={}){
  return `<header class="top">${stack.length>1?`<button class="ib" onclick="back()" aria-label="Indietro">←</button>`:''}
    <h1>${title}</h1>${opts.right||''}${stack.length>2?`<button class="ib" onclick="goHome()" aria-label="Home">⌂</button>`:''}</header>`;
}
function goHome(){ const n=stack.length-1; stack=[stack[0]]; history.go(-n); setTimeout(render,0); render(); }

/* ===================== MODALI ===================== */
function openModal(html, opt={}){
  modals.push({html, locked:!!opt.locked, onClose:opt.onClose, anim:true});
  if(opt.locked){ history.pushState({d:stack.length,lock:1},''); extraHist++; }
  drawModals();
  setTimeout(()=>{ const el=document.querySelector('#modals .ov:last-child [data-af]'); if(el) el.focus(); },50);
}
function drawModals(){
  $('modals').innerHTML = modals.map((m,i)=>`<div class="ov" onclick="if(event.target===this&&!modals[${i}].locked)closeModal()"><div class="sheet${m.anim?' anim':''}">${m.html}</div></div>`).join('');
  modals.forEach(m=>m.anim=false);
}
function replaceModal(html){ if(!modals.length) return openModal(html); modals[modals.length-1].html=html; drawModals(); }
function closeModal(){ const m=modals.pop(); drawModals(); if(m&&m.onClose) m.onClose(); }
function closeAllModals(force){ if(force){ modals=modals.filter(m=>m.locked); drawModals(); } }
function mh(title, locked){ return `<h2>${title}${locked?'':'<button class="x" onclick="closeModal()">✕</button>'}</h2>`; }
function alertBox(t){ openModal(mh('Attenzione')+`<p>${esc(t)}</p><div class="acts"><button class="btn" onclick="closeModal()">OK</button></div>`); }
function confirmBox(t, fn, label='Elimina'){
  window._cf = fn;
  openModal(mh('Conferma')+`<p>${esc(t)}</p><div class="acts"><button class="btn sec" onclick="closeModal()">Annulla</button><button class="btn del" onclick="closeModal();_cf()">${label}</button></div>`);
}
function val(id){ const e=$(id); return e ? e.value.trim() : ''; }

/* ===================== VISTE ===================== */
const VIEWS = {};

/* ---------- HOME ---------- */
VIEWS.home = () => {
  const t = today();
  const evs = evOf(t);
  const appEvt = evs.filter(e=>e.type!=='tel');
  const tels = evs.filter(e=>e.type==='tel');
  const tasks = dueTasks();
  const past = pendingPast();
  const daysNoBk = db.meta.lastBackup ? diffDays(t, db.meta.lastBackup) : null;
  let ban = '';
  if(past.length) ban += `<div class="banner r" onclick="chiudiGiornata(true)">⚠️ <div class="grow"><b>${past.length} appuntamenti/contatti</b> dei giorni scorsi da esitare.</div><button class="btn sm del">Esita</button></div>`;
  if(daysNoBk===null ? db.clients.length>0 : daysNoBk>7) ban += `<div class="banner y" onclick="backupModal()">💾 <div class="grow">${daysNoBk===null?'Nessun backup ancora eseguito.':'Ultimo backup '+daysNoBk+' giorni fa.'}</div><button class="btn sm warn">Backup</button></div>`;
  return hdr('JOB', {right:`<button class="ib" onclick="backupModal()" aria-label="Export / Import">💾</button>`}) + `<div class="wrap">
    <div class="mut" style="margin:-2px 0 10px;font-weight:600">${fdl(t)}</div>
    ${ban}
    <div class="tiles">
      <button class="tile" onclick="go('clients')"><span class="ic">👤</span>CLIENTE</button>
      <button class="tile" onclick="go('cal',{w:monday(today())})"><span class="ic">📅</span>CALENDARIO</button>
      <button class="tile" onclick="go('psearch')"><span class="ic">🔎</span>RICERCA PRODOTTI</button>
      <button class="tile" onclick="go('tasks')"><span class="ic">✅</span>TASK</button>
      <button class="tile" onclick="clientForm()"><span class="ic">➕</span>NUOVO</button>
      <button class="tile close" onclick="chiudiGiornata(false)"><span class="ic">🌙</span>CHIUDI GIORNATA</button>
    </div>
    <div class="card"><h3>📅 Appuntamenti / Eventi <span class="cnt">${appEvt.length}</span></h3>
      ${appEvt.length? `<div class="list">${appEvt.map(evRow).join('')}</div>` : '<div class="empty">Nessun appuntamento o evento oggi.</div>'}
    </div>
    <div class="card"><h3>📞 Contatti e Task <span class="cnt">${tels.length+tasks.length}</span></h3>
      ${tels.length? `<div class="list">${tels.map(evRow).join('')}</div>` : '<div class="empty">Nessuna telefonata da fare oggi.</div>'}
      ${tasks.length? `<div class="list" style="margin-top:6px;border-top:1px solid var(--line)">${tasks.map(({c,t})=>`
        <div class="it" onclick="go('collab',{id:${q(c.id)}})"><span class="badge">TASK</span>
          <div class="grow"><div class="t">${esc(c.name)} — ${esc(firstLine(t.text))}</div><div class="mut">${dueLabel(t.due)}</div></div><span class="go">›</span></div>`).join('')}</div>` : ''}
    </div>
  </div>`;
};
function evRow(e){
  const c = e.clientId ? client(e.clientId) : null;
  const st = e.type==='evt' ? '' : e.status==='closed' ? '<span class="badge b-done">✓</span>' : e.status==='riprog' ? '<span class="badge b-rip">RIPROG.</span>' : '';
  return `<div class="it" onclick="evDetail(${q(e.id)})">
    <span class="time">${e.time||'—'}</span>
    <div class="grow"><div><span class="badge b-${e.type}">${TYPE[e.type]}</span> ${st}</div>
      <div class="t" style="margin-top:3px">${c?`<span class="link" onclick="event.stopPropagation();go('client',{id:${q(c.id)},tab:'note'})">${esc(cname(c))}</span>`:esc(e.title||'')}</div>
      ${e.note?`<div class="mut">${esc(firstLine(e.note))}</div>`:''}</div><span class="go">›</span></div>`;
}
function firstLine(s){ s=String(s||''); const l=s.split('\n')[0]; return l.length>70?l.slice(0,70)+'…':l; }

/* ---------- 1) CLIENTE: ricerca ---------- */
VIEWS.clients = s => {
  s.f = s.f || 'cli';
  return hdr('Clienti') + `<div class="wrap">
    <input type="search" id="cq" data-af placeholder="Cerca per nome, cognome, NDG, cellulare, email" value="${esc(s.q||'')}" oninput="cur().q=this.value;drawClientList()">
    <div class="seg">
      <button class="${s.f==='cli'?'on':''}" onclick="cur().f='cli';render()">Clienti</button>
      <button class="${s.f==='pro'?'on':''}" onclick="cur().f='pro';render()">Prospect</button>
      <button class="${s.f==='all'?'on':''}" onclick="cur().f='all';render()">Tutti</button>
    </div>
    <div class="card"><div class="list" id="clist"></div></div>
  </div><button class="btn fab" onclick="clientForm()">➕ NUOVO CLIENTE</button>`;
};
function matchClient(c, qs){
  const hay = [c.cognome,c.nome,c.ndg,c.cell,c.email].map(x=>String(x||'').toLowerCase());
  const hayDigits = [c.cell,c.ndg].map(x=>String(x||'').replace(/\D/g,''));
  return qs.toLowerCase().split(/\s+/).filter(Boolean).every(tk=>{
    const d = tk.replace(/\D/g,'');
    return hay.some(h=>h.includes(tk)) || (d.length>=3 && hayDigits.some(h=>h.includes(d)));
  });
}
function drawClientList(){
  const s = cur(); const el=$('clist'); if(!el) return;
  let list = db.clients.filter(c=> s.f==='all' || (s.f==='pro' ? c.prospect : !c.prospect));
  if(s.q && s.q.trim()) list = list.filter(c=>matchClient(c, s.q));
  list.sort((a,b)=>cname(a).localeCompare(cname(b)));
  el.innerHTML = list.length ? list.map(c=>`<div class="it" onclick="go('client',{id:${q(c.id)}})">
     <div class="grow"><div class="t">${esc(cname(c))} ${c.prospect?'<span class="badge b-pro">PROSPECT</span>':''}</div>
     <div class="mut">${[c.ndg?'NDG '+esc(c.ndg):'', esc(c.cell||''), esc(c.email||'')].filter(Boolean).join(' · ')}</div></div><span class="go">›</span></div>`).join('')
   : `<div class="empty">${db.clients.length?'Nessun risultato.':'Nessun cliente. Usa NUOVO per inserirne uno.'}</div>`;
}

/* ---------- Anagrafica: nuovo / modifica ---------- */
function clientForm(id){
  const c = id ? client(id) : {};
  openModal(mh(id?'Modifica anagrafica':'Nuovo cliente') + `
    <label class="f">Cognome <b>*</b></label><input type="text" id="fCog" data-af value="${esc(c.cognome||'')}" autocapitalize="words">
    <label class="f">Nome</label><input type="text" id="fNom" value="${esc(c.nome||'')}" autocapitalize="words">
    <label class="f">NDG</label><input type="text" id="fNdg" value="${esc(c.ndg||'')}" inputmode="numeric">
    <label class="f">Cellulare</label><input type="tel" id="fCel" value="${esc(c.cell||'')}">
    <label class="f">Email</label><input type="email" id="fEm" value="${esc(c.email||'')}" autocapitalize="off">
    ${id && c.prospect ? `<label class="row" style="margin-top:12px"><input type="checkbox" id="fPro" checked style="width:20px;height:20px"> È ancora un prospect</label>`:''}
    <div class="acts">${id?`<button class="btn del" onclick="delClient(${q(id)})">Elimina</button>`:''}<button class="btn" onclick="saveClient(${id?q(id):'null'})">Salva</button></div>`);
}
function saveClient(id){
  const cog = val('fCog');
  if(!cog) return toast('Il cognome è obbligatorio');
  const data = {cognome:cog.toUpperCase(), nome:val('fNom'), ndg:val('fNdg'), cell:val('fCel'), email:val('fEm')};
  if(data.ndg){ const dup=db.clients.find(x=>x.ndg===data.ndg && x.id!==id); if(dup) return toast('NDG già usato da '+cname(dup)); }
  if(id){ const c=client(id); Object.assign(c,data); if($('fPro')) c.prospect=$('fPro').checked; save(); closeModal(); render(); toast('Anagrafica aggiornata'); }
  else{ const c=newClient(data,false); save(); closeModal(); go('client',{id:c.id}); toast('Cliente creato'); }
}
function newClient(data, prospect){
  const c = Object.assign({id:uid(), cognome:'', nome:'', ndg:'', cell:'', email:'', prospect:!!prospect, info:[], notes:[], products:{}, created:today()}, data);
  db.clients.push(c); return c;
}
function delClient(id){
  confirmBox('Eliminare definitivamente il cliente, le sue note e i suoi appuntamenti?', ()=>{
    db.clients = db.clients.filter(c=>c.id!==id);
    db.events = db.events.filter(e=>e.clientId!==id);
    save(); closeAllModals(true); back(); toast('Cliente eliminato');
  });
}

/* ---------- Scheda cliente ---------- */
VIEWS.client = s => {
  const c = client(s.id); if(!c) return hdr('Cliente')+'<div class="wrap empty">Cliente non trovato.</div>';
  s.tab = s.tab || 'info';
  const tabs = `<div class="tabs">
    <button class="${s.tab==='info'?'on':''}" onclick="setP({tab:'info'})">INFO +</button>
    <button class="${s.tab==='note'?'on':''}" onclick="setP({tab:'note'})">NOTE</button>
    <button class="${s.tab==='prod'?'on':''}" onclick="setP({tab:'prod'})">PRODOTTI</button>
    <button class="fix" onclick="bookForm({clientId:${q(c.id)},types:['app','tel']})">FISSA APP/TEL</button></div>`;
  let body = '';
  if(s.tab==='info') body = infoTab(c);
  if(s.tab==='note') body = notesTab(c);
  if(s.tab==='prod') body = prodTab(c, s);
  return hdr(esc(cname(c))) + `<div class="wrap">
    <div class="card">
      <div class="row" style="margin-bottom:10px"><div class="grow" style="font-weight:800;font-size:17px">${esc(cname(c))} ${c.prospect?'<span class="badge b-pro">PROSPECT</span>':''}</div>
      <button class="btn sm sec" onclick="clientForm(${q(c.id)})">✎ Modifica</button></div>
      <div class="kv">
        <div>Cognome</div><div>${esc(c.cognome)}</div>
        <div>Nome</div><div>${esc(c.nome)||'—'}</div>
        <div>NDG</div><div>${esc(c.ndg)||'—'}</div>
        <div>Cellulare</div><div>${c.cell?`<a href="tel:${esc(c.cell.replace(/\s/g,''))}">${esc(c.cell)}</a>`:'—'}</div>
        <div>Email</div><div>${c.email?`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:'—'}</div>
      </div>
      ${c.prospect?`<button class="btn sm sec" style="margin-top:12px" onclick="promote(${q(c.id)})">⬆ Trasforma in cliente</button>`:''}
    </div>
    ${tabs}${body}</div>`;
};
function promote(id){ const c=client(id); c.prospect=false; save(); render(); toast('Ora è un cliente'); }

/* INFO + */
function infoTab(c){
  return `<div class="card"><h3>Info +</h3>
    <ul class="bul">${c.info.length? c.info.map((t,i)=>`<li><span class="dot"></span><div class="grow" style="white-space:pre-wrap">${esc(t)}</div>
      <button class="icb" onclick="infoEdit(${q(c.id)},${i})">✎</button><button class="icb" onclick="infoDel(${q(c.id)},${i})">🗑</button></li>`).join('') : '<li class="empty">Nessuna informazione.</li>'}</ul>
    <div class="row" style="margin-top:10px"><input type="text" id="infoNew" placeholder="Nuova informazione…" onkeydown="if(event.key==='Enter')infoAdd(${q(c.id)})"><button class="btn" onclick="infoAdd(${q(c.id)})">+</button></div></div>`;
}
function infoAdd(id){ const t=val('infoNew'); if(!t) return; client(id).info.push(t); save(); render(); setTimeout(()=>$('infoNew')&&$('infoNew').focus(),30); }
function infoEdit(id,i){ const c=client(id);
  openModal(mh('Modifica informazione')+`<textarea id="infoE" data-af>${esc(c.info[i])}</textarea><div class="acts"><button class="btn" onclick="(function(){const v=val('infoE');if(!v)return;client(${q(id)}).info[${i}]=v;save();closeModal();render();})()">Salva</button></div>`); }
function infoDel(id,i){ confirmBox('Eliminare questa informazione?', ()=>{ client(id).info.splice(i,1); save(); render(); }); }

/* NOTE */
function noteState(n){
  if(n.type==='appunto') return 'app0';
  if(n.esito==='RIPROGRAMMATO' || n.rip) return 'rip';
  return n.esito ? 'done' : 'wait';
}
function notesTab(c){
  const ns = [...c.notes].sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||'')) || (b.ts||0)-(a.ts||0));
  return `<div class="card"><div class="row" style="margin-bottom:10px"><h3 style="margin:0" class="grow">Note</h3>
    <button class="btn sm" onclick="noteForm(${q(c.id)})">+ Aggiungi appunto</button></div>
    ${ns.length? ns.map(n=>noteHtml(c,n)).join('') : '<div class="empty">Nessuna nota.</div>'}</div>`;
}
function noteHtml(c,n){
  const st = noteState(n);
  const lab = n.type==='appunto' ? '<span class="badge">APPUNTO</span>' : `<span class="badge b-${n.type}">${TYPE[n.type]}${n.time?' '+n.time:''}</span>`;
  const stb = st==='wait'?'<span class="badge b-wait">DA ESITARE</span>':st==='rip'?'<span class="badge b-rip">RIPROGRAMMATO</span>':st==='done'?'<span class="badge b-done">ESITATO</span>':'';
  let body = '';
  if(n.type==='appunto') body = `<p>${esc(n.text)}</p>`;
  else{
    body = `<div class="lab">Oggetto primario</div><p>${esc(n.oggetto)||'<span class="mut">—</span>'}</p>`;
    if(n.esito && n.esito!=='RIPROGRAMMATO') body += `<div class="lab" style="margin-top:6px">Esito</div><p>${esc(n.esito)}</p>`;
    if(n.rip) body += `<p class="mut">↪ RIPROGRAMMATO al ${fd(n.rip.date)}${n.rip.time?' ore '+n.rip.time:''}</p>`;
    if(st==='wait') body += `<button class="btn sm warn" style="margin-top:6px" onclick="esitoForm(${q(c.id)},${q(n.id)})">Compila esito</button>`;
  }
  return `<div class="note ${st}"><div class="hd"><span class="dt">${fd(n.date)}</span>${lab}${stb}
    <span class="op"><button class="icb" onclick="noteForm(${q(c.id)},${q(n.id)})">✎</button><button class="icb" onclick="noteDel(${q(c.id)},${q(n.id)})">🗑</button></span></div>${body}</div>`;
}
function noteForm(cid, nid){
  const c=client(cid); const n = nid ? c.notes.find(x=>x.id===nid) : {type:'appunto', date:today(), text:''};
  if(n.type==='appunto'){
    openModal(mh(nid?'Modifica appunto':'Nuovo appunto')+`
      <label class="f">Data</label><input type="date" id="nD" value="${n.date}">
      <label class="f">Appunto <b>*</b></label><textarea id="nT" data-af>${esc(n.text)}</textarea>
      <div class="acts"><button class="btn" onclick="saveAppunto(${q(cid)},${nid?q(nid):'null'})">Salva</button></div>`);
  } else {
    openModal(mh('Modifica nota '+TYPE[n.type].toLowerCase())+`
      <div class="mut">${fd(n.date)}${n.time?' ore '+n.time:''} — la data si cambia con RIPROGRAMMA dal calendario.</div>
      <label class="f">Oggetto primario</label><textarea id="nO">${esc(n.oggetto)}</textarea>
      ${n.esito!=='RIPROGRAMMATO'?`<label class="f">Esito</label><textarea id="nE" placeholder="Come è andato?">${esc(n.esito)}</textarea>`:''}
      <div class="acts"><button class="btn" onclick="saveNoteEdit(${q(cid)},${q(nid)})">Salva</button></div>`);
  }
}
function saveAppunto(cid,nid){
  const t=val('nT'); if(!t) return toast('Scrivi l\'appunto');
  const c=client(cid);
  if(nid){ const n=c.notes.find(x=>x.id===nid); n.text=t; n.date=val('nD')||n.date; }
  else c.notes.push({id:uid(), type:'appunto', date:val('nD')||today(), text:t, ts:Date.now()});
  save(); closeModal(); render();
}
function saveNoteEdit(cid,nid){
  const c=client(cid); const n=c.notes.find(x=>x.id===nid);
  n.oggetto = val('nO');
  const e = n.eventId ? event_(n.eventId) : null;
  if(e) e.note = n.oggetto;
  if($('nE')){ n.esito = val('nE'); if(e && e.status!=='riprog') e.status = n.esito ? 'closed' : 'open'; }
  save(); closeModal(); render();
}
function noteDel(cid,nid){
  const c=client(cid); const n=c.notes.find(x=>x.id===nid);
  const e = n.eventId ? event_(n.eventId) : null;
  confirmBox(e?'Eliminare la nota? Verrà eliminato anche l\'impegno collegato dal calendario.':'Eliminare questa nota?', ()=>{
    c.notes = c.notes.filter(x=>x.id!==nid);
    if(e) db.events = db.events.filter(x=>x.id!==e.id);
    save(); render();
  });
}
function esitoForm(cid, nid, after){
  const c=client(cid); const n=c.notes.find(x=>x.id===nid);
  window._esAfter = after || null;
  openModal(mh('Esito '+TYPE[n.type].toLowerCase())+`
    <div class="mut">${esc(cname(c))} — ${fd(n.date)}${n.time?' ore '+n.time:''}</div>
    ${n.oggetto?`<label class="f">Oggetto primario</label><div>${esc(n.oggetto)}</div>`:''}
    <label class="f">Com'è andato? <b>*</b></label><textarea id="esT" data-af>${esc(n.esito||'')}</textarea>
    <div class="acts"><button class="btn ok" onclick="saveEsito(${q(cid)},${q(nid)})">Salva esito</button></div>`);
}
function saveEsito(cid,nid){
  const t=val('esT'); if(!t) return toast('L\'esito è obbligatorio');
  const c=client(cid); const n=c.notes.find(x=>x.id===nid);
  n.esito=t; const e=n.eventId?event_(n.eventId):null; if(e){ e.status='closed'; e.esito=t; }
  save(); closeModal(); render(); toast('Esito salvato');
  if(window._esAfter){ const f=window._esAfter; window._esAfter=null; f(); }
}

/* PRODOTTI nella scheda */
function stOf(c, id){ return (c.products[id]||{}).s || ''; }
function counts(c, node){ const r={g:0,y:0,r:0}; leaves(node).forEach(l=>{ const s=stOf(c,l.id); if(s) r[s]++; }); return r; }
function pillHtml(k){ return `<span class="pill">${k.g?`<i class="pg">${k.g}</i>`:''}${k.y?`<i class="py">${k.y}</i>`:''}${k.r?`<i class="pr">${k.r}</i>`:''}</span>`; }
function prodTab(c, s){
  s.op = s.op || {};
  const rows = (list, dep) => list.map(n=>{
    const ind = `style="padding-left:${4+dep*18}px"`;
    if(n.c){ const k=counts(c,n); const o=s.op[n.id];
      return `<div class="prod" ${ind} onclick="togOpen(${q(n.id)})"><span class="arr">${o?'▾':'▸'}</span><span class="nm">${esc(n.n)}</span>${pillHtml(k)}</div>` + (o ? rows(n.c, dep+1) : ''); }
    const st = stOf(c,n.id); const d=c.products[n.id]||{};
    return `<div class="prod" ${ind} onclick="prodPick(${q(c.id)},${q(n.id)})"><span class="arr"></span><div class="grow"><div class="nm s-${st||'n'}">${esc(n.n)}</div>
      ${st==='r'&&d.nota?`<div class="mut">✗ ${esc(d.nota)}</div>`:''}${st&&d.d?`<div class="mut" style="font-size:11px">dal ${fd(d.d)}</div>`:''}</div>
      <span class="badge ${st==='g'?'b-done':st==='y'?'b-wait':''}" style="${st==='r'?'background:var(--rbg);color:var(--r)':''}">${st==='g'?'POSSEDUTO':st==='y'?'TRATTATIVA':st==='r'?'RIFIUTATO':'—'}</span></div>`;
  }).join('');
  return PRODUCTS.map(a=>`<div class="card pbox"><h3>${esc(a.n)} ${pillHtml(counts(c,a))}</h3>${rows(a.c,0)}</div>`).join('') +
    `<div class="legend" style="margin:-2px 4px 12px"><span class="s-g">Posseduto</span><span class="s-y">In trattativa</span><span class="s-r">Rifiutato</span><span class="s-n">Mai selezionato</span></div>`;
}
function togOpen(id){ const s=cur(); s.op=s.op||{}; s.op[id]=!s.op[id]; const y=window.scrollY; render(); window.scrollTo(0,y); }
function prodPick(cid, pid){
  const c=client(cid); const d=c.products[pid]||{};
  openModal(mh(esc(P[pid].n)) + `<div class="mut">${esc(pathLabel(pid))}</div>
    <div class="choice">
      <button class="btn ok" onclick="setProd(${q(cid)},${q(pid)},'g')">✓ Prodotto già posseduto</button>
      <button class="btn warn" onclick="setProd(${q(cid)},${q(pid)},'y')">… Prodotto in trattativa</button>
      <button class="btn del" onclick="refuseForm(${q(cid)},${q(pid)})">✗ Prodotto rifiutato</button>
      ${d.s?`<button class="btn sec" onclick="setProd(${q(cid)},${q(pid)},'')">Azzera (torna grigio)</button>`:''}
    </div>`);
}
function setProd(cid,pid,s,nota){
  const c=client(cid);
  if(!s) delete c.products[pid]; else c.products[pid]={s, d:today(), nota:nota||''};
  save(); closeAllModals(true); render();
}
function refuseForm(cid,pid){
  const d=client(cid).products[pid]||{};
  replaceModal(mh('Rifiutato: '+esc(P[pid].n))+`<label class="f">Ragioni del rifiuto <b>*</b></label><textarea id="rfT" data-af>${esc(d.s==='r'?d.nota:'')}</textarea>
    <div class="acts"><button class="btn del" onclick="(function(){const t=val('rfT');if(!t)return toast('Indica le ragioni');setProd(${q(cid)},${q(pid)},'r',t);})()">Salva rifiuto</button></div>`);
  setTimeout(()=>$('rfT')&&$('rfT').focus(),50);
}

/* ---------- PRENOTAZIONI (Fissa app/tel, Prenota, Riprogramma) ---------- */
/* o = {types:[...], type, clientId, date, time, note, rescheduleOf, after} */
let BF = null;
function bookForm(o){
  BF = Object.assign({types:['app','tel','evt']}, o);
  if(!BF.type && BF.types.length===1) BF.type = BF.types[0];
  BF.date = BF.date || today();
  BF.mode = BF.mode || 'search';
  if(modals.length && BF.replace) replaceModal(bookHtml()); else openModal(bookHtml());
}
function bookHtml(){
  const o = BF;
  const title = o.rescheduleOf ? 'Riprogramma' : o.type ? (o.type==='app'?'Nuovo appuntamento':o.type==='tel'?'Nuovo contatto telefonico':'Nuovo evento') : 'Prenota';
  if(!o.type){
    return mh(title)+`<div class="choice">${o.types.map(t=>`<button class="btn ${t==='app'?'':t==='tel'?'ok':'sec'}" onclick="BF.type='${t}';replaceModal(bookHtml())">${t==='app'?'📅 APPUNTAMENTO':t==='tel'?'📞 CONTATTO':'🗓 EVENTO'}</button>`).join('')}</div>`;
  }
  let who = '';
  if(o.type!=='evt'){
    const c = o.clientId ? client(o.clientId) : null;
    if(c) who = `<label class="f">Cliente</label><div class="row"><div class="grow" style="font-weight:700">${esc(cname(c))} ${c.prospect?'<span class="badge b-pro">PROSPECT</span>':''}</div>${o.lockClient?'':`<button class="btn sm sec" onclick="bfKeep();BF.clientId=null;replaceModal(bookHtml())">Cambia</button>`}</div>`;
    else who = `<div class="seg"><button class="${o.mode==='search'?'on':''}" onclick="bfKeep();BF.mode='search';replaceModal(bookHtml())">Anagrafica</button><button class="${o.mode==='pro'?'on':''}" onclick="bfKeep();BF.mode='pro';replaceModal(bookHtml())">Nuovo prospect</button></div>` +
      (o.mode==='search' ? `<input type="search" id="bfQ" data-af placeholder="Cerca cliente…" value="${esc(o.q||'')}" oninput="BF.q=this.value;bfResults()"><div class="card" style="margin-top:8px;padding:4px 12px"><div class="list" id="bfR"></div></div>`
        : `<label class="f">Cognome <b>*</b></label><input type="text" id="bfCog" data-af value="${esc(o.pCog||'')}"><label class="f">Nome</label><input type="text" id="bfNom" value="${esc(o.pNom||'')}"><label class="f">Cellulare <b>*</b></label><input type="tel" id="bfCel" value="${esc(o.pCel||'')}">`);
  } else who = `<label class="f">Titolo evento <b>*</b></label><input type="text" id="bfTit" data-af value="${esc(o.title||'')}">`;
  const html = mh(title) + who + `
    <div class="row"><div class="grow"><label class="f">Data <b>*</b></label><input type="date" id="bfD" value="${o.date}" onchange="BF.date=this.value;bfDay()"></div>
    <div style="width:42%"><label class="f">Ora ${o.type==='app'?'<b>*</b>':'(facolt.)'}</label><input type="time" id="bfT" value="${o.time||''}"></div></div>
    <label class="f">${o.type==='evt'?'Nota':'Nota / oggetto primario'} (facoltativa)</label><textarea id="bfN">${esc(o.note||'')}</textarea>
    <div class="mut" style="margin-top:10px;font-weight:700">Impegni del giorno:</div><div id="bfDay" class="mut"></div>
    <div class="acts"><button class="btn" onclick="bfSave()">Salva</button></div>`;
  setTimeout(()=>{ bfResults(); bfDay(); },0);
  return html;
}
function bfKeep(){ // conserva i campi digitati quando si ridisegna
  const g=id=>$(id)?$(id).value:undefined;
  if(g('bfD')!==undefined) BF.date=g('bfD'); if(g('bfT')!==undefined) BF.time=g('bfT'); if(g('bfN')!==undefined) BF.note=g('bfN');
  if(g('bfCog')!==undefined){ BF.pCog=g('bfCog'); BF.pNom=g('bfNom'); BF.pCel=g('bfCel'); }
}
function bfResults(){
  const el=$('bfR'); if(!el) return;
  const qq=(BF.q||'').trim();
  let list = qq ? db.clients.filter(c=>matchClient(c,qq)) : [];
  list = list.slice(0,30);
  el.innerHTML = !qq ? '<div class="empty">Digita per cercare in anagrafica.</div>' : list.length ? list.map(c=>`<div class="it" onclick="bfKeep();BF.clientId=${q(c.id)};replaceModal(bookHtml())"><div class="grow"><div class="t">${esc(cname(c))} ${c.prospect?'<span class="badge b-pro">P</span>':''}</div><div class="mut">${esc(c.ndg?'NDG '+c.ndg:'')} ${esc(c.cell||'')}</div></div></div>`).join('') : '<div class="empty">Nessun cliente trovato. Usa “Nuovo prospect”.</div>';
}
function bfDay(){
  const el=$('bfDay'); if(!el) return; const d=val('bfD'); if(!d){ el.innerHTML=''; return; }
  const ev=evOf(d).filter(e=>e.status!=='riprog');
  el.innerHTML = ev.length ? ev.map(e=>`<div>• ${e.time||'--:--'} ${TYPE[e.type]} ${esc(e.clientId?cname(client(e.clientId)):e.title||'')}</div>`).join('') : 'Nessun impegno.';
}
function bfSave(){
  bfKeep(); const o=BF;
  const date=val('bfD'), time=val('bfT'), note=val('bfN');
  if(!date) return toast('Indica la data');
  if(o.type==='app' && !time) return toast('Per l\'appuntamento l\'ora è obbligatoria');
  let cid = o.clientId, title='';
  if(o.type==='evt'){ title=val('bfTit'); if(!title) return toast('Indica il titolo dell\'evento'); }
  else if(!cid){
    if(o.mode!=='pro') return toast('Scegli un cliente o crea un prospect');
    const cog=val('bfCog'), cel=val('bfCel');
    if(!cog || !cel) return toast('Per il prospect servono cognome e cellulare');
    cid = newClient({cognome:cog.toUpperCase(), nome:val('bfNom'), cell:cel}, true).id;
  }
  const e = {id:uid(), type:o.type, date, time, clientId:cid||null, title, note, status:o.type==='evt'?'evt':'open', created:Date.now()};
  db.events.push(e);
  if(cid){
    const n = {id:uid(), type:o.type, date, time, oggetto:note, esito:'', eventId:e.id, ts:Date.now()};
    client(cid).notes.push(n); e.noteId=n.id;
  }
  if(o.rescheduleOf){
    const old=event_(o.rescheduleOf);
    if(old){ old.status='riprog'; old.rip={date,time};
      const oc=old.clientId?client(old.clientId):null; const on=oc&&oc.notes.find(x=>x.id===old.noteId);
      if(on){ on.esito='RIPROGRAMMATO'; on.rip={date,time}; } }
  }
  save();
  const after=o.after; BF=null;
  closeModal(); render();
  toast(o.rescheduleOf?'Riprogrammato al '+fd(date):'Salvato in calendario'+(cid?' e nelle note':''));
  if(after) after();
}

/* ---------- 6) CHIUDI GIORNATA ---------- */
function chiudiGiornata(forcedOnly){
  const t=today();
  const queue = db.events.filter(e=>e.type!=='evt' && e.status==='open' && (forcedOnly ? e.date<t : e.date<=t)).sort(sortEv).map(e=>e.id);
  if(!queue.length){ if(forcedOnly) toast('Nessun impegno arretrato'); else finishDay(); return; }
  const locked = forcedOnly || queue.some(id=>event_(id).date<t);
  window._cg = {queue, i:0, total:queue.length, locked, forcedOnly};
  openModal(cgHtml(), {locked});
}
function cgHtml(){
  const g=window._cg; const e=event_(g.queue[g.i]); const c=client(e.clientId); const n=c&&c.notes.find(x=>x.id===e.noteId);
  const late = e.date<today();
  return mh(`Chiudi giornata <span class="mut" style="font-weight:600">${g.i+1} di ${g.total}</span>`, g.locked) +
    (g.locked?`<div class="banner r" style="margin-top:8px">⚠️ Ci sono impegni non esitati dei giorni scorsi: l'esito è obbligatorio.</div>`:'') + `
    <div class="card" style="margin-top:10px"><div><span class="badge b-${e.type}">${TYPE[e.type]}</span> ${late?'<span class="badge" style="background:var(--rbg);color:var(--r)">ARRETRATO</span>':''}</div>
      <div style="font-weight:800;font-size:16px;margin-top:6px">${esc(cname(c))}</div>
      <div class="mut">${fdl(e.date)}${e.time?' ore '+e.time:''}${c&&c.cell?' · '+esc(c.cell):''}</div>
      ${e.note?`<label class="f">Oggetto primario</label><div style="white-space:pre-wrap">${esc(e.note)}</div>`:''}</div>
    <label class="f">Esito <b>*</b></label><textarea id="cgT" data-af placeholder="Com'è andato?">${esc(n&&n.esito||'')}</textarea>
    <div class="acts"><button class="btn warn" onclick="cgRip()">RIPROGRAMMA</button><button class="btn ok" onclick="cgSave()">SALVA ESITO</button></div>
    ${g.locked?'':'<div style="text-align:center;margin-top:10px"><button class="btn sm sec" onclick="closeModal()">Continua più tardi</button></div>'}`;
}
function cgSave(){
  const t=val('cgT'); if(!t) return toast('Compila l\'esito oppure riprogramma');
  const g=window._cg; const e=event_(g.queue[g.i]); const c=client(e.clientId); const n=c&&c.notes.find(x=>x.id===e.noteId);
  e.status='closed'; e.esito=t; if(n) n.esito=t; save(); cgNext();
}
function cgRip(){
  const g=window._cg; const id=g.queue[g.i];
  reschedule(id, ()=>cgNext());
}
function cgNext(){
  const g=window._cg; g.i++;
  // salta quelli chiusi nel frattempo
  while(g.i<g.queue.length && (event_(g.queue[g.i])||{}).status!=='open') g.i++;
  if(g.i>=g.queue.length){
    modals=modals.filter(m=>!m.html.includes('Chiudi giornata')); drawModals();
    render(); if(g.forcedOnly) toast('Arretrati esitati ✓'); else finishDay(); return;
  }
  const m = modals.find(m=>m.html.includes('Chiudi giornata'));
  if(m){ m.html=cgHtml(); drawModals(); setTimeout(()=>$('cgT')&&$('cgT').focus(),50); }
  render();
}

/* ---------- 3) RICERCA PRODOTTI ---------- */
const CRIT = {own:{l:'POSSIEDE',c:'cg'}, neg:{l:'IN TRATTATIVA',c:'cy'}, con:{l:'DA CONTATTARE',c:''}};
function emptyCrit(){ return {own:[],neg:[],con:[]}; }
let PS = emptyCrit(); // ricerca in corso
VIEWS.psearch = s => {
  const any = PS.own.length+PS.neg.length+PS.con.length;
  return hdr('Ricerca prodotti', {right:`<button class="ib" onclick="go('saved')" aria-label="Ricerche salvate">📁</button>`}) + `<div class="wrap">
    ${Object.keys(CRIT).map(k=>`<div class="card crit ${CRIT[k].c}"><h3>${CRIT[k].l} <span class="cnt">facoltativo</span></h3>
      <div class="chips">${PS[k].map((id,i)=>`<span class="chip">${esc(pathLabel(id))}<button onclick="PS.${k}.splice(${i},1);cur().res=null;render()">✕</button></span>`).join('')}</div>
      <button class="btn sm sec" onclick="pickProducts('${k}')">+ Aggiungi prodotto</button></div>`).join('')}
    <div class="row"><button class="btn sec" onclick="PS=emptyCrit();cur().res=null;render()">Svuota</button>
      <button class="btn grow" ${any?'':'disabled'} onclick="cur().res=1;render()">🔎 CERCA</button></div>
    ${s.res && any ? resultsHtml(PS, null) : ''}
  </div>`;
};
function critText(cr){ return Object.keys(CRIT).filter(k=>cr[k].length).map(k=>CRIT[k].l+': '+cr[k].join(', ')).join('   |   '); }
// stato di un prodotto (o categoria) per un cliente
function hasS(c, id, s){ return leaves(P[id]).some(l=>stOf(c,l.id)===s); }
function conState(c, id){ // per DA CONTATTARE: 'no' (già posseduto/trattativa) | 'red' (tutto rifiutato) | 'part' (in parte rifiutato) | 'ok'
  const ls=leaves(P[id]); const ss=ls.map(l=>stOf(c,l.id));
  if(ss.some(s=>s==='g'||s==='y')) return 'no';
  if(ss.every(s=>s==='r')) return 'red';
  if(ss.some(s=>s==='r')) return 'part';
  return 'ok';
}
function runSearch(cr){
  const out=[];
  db.clients.forEach(c=>{
    if(!cr.own.every(id=>hasS(c,id,'g'))) return;
    if(!cr.neg.every(id=>hasS(c,id,'y'))) return;
    let alert=[];
    if(cr.con.length){
      const st=cr.con.map(id=>conState(c,id));
      if(st.includes('no')) return;
      if(st.every(x=>x==='red')) return; // tutti rifiutati: escluso
      cr.con.forEach((id,i)=>{ if(st[i]!=='ok') alert.push(P[id].n); });
    }
    out.push({c, alert});
  });
  return out.sort((a,b)=>cname(a.c).localeCompare(cname(b.c)));
}
function nextTel(c){ return db.events.filter(e=>e.clientId===c.id && e.type==='tel' && e.status==='open').sort(sortEv)[0]; }
function resultsHtml(cr, savedId){
  const r=runSearch(cr);
  return `<div class="card" style="margin-top:12px"><div class="row" style="margin-bottom:6px"><h3 class="grow" style="margin:0">Risultati <span class="cnt">${r.length}</span></h3>
     ${savedId?'':`<button class="btn sm sec" onclick="saveSearchForm()">💾 Salva</button>`}<button class="btn sm" onclick="pdfSearch(${savedId?q(savedId):'null'})">PDF</button></div>
    ${r.some(x=>x.alert.length)?'<div class="mut" style="margin-bottom:6px"><span class="alert">⚠</span> = uno o più prodotti cercati sono stati rifiutati</div>':''}
    <div class="list res">${r.length? r.map(({c,alert})=>{ const nt=nextTel(c); return `<div class="it" onclick="resAction(${q(c.id)})">
      <div class="grow"><div class="t">${alert.length?'<span class="alert">⚠</span> ':''}${esc(cname(c))} ${c.prospect?'<span class="badge b-pro">P</span>':''}</div>
      <div class="mut">${[c.ndg?'NDG '+esc(c.ndg):'',esc(c.cell||'')].filter(Boolean).join(' · ')}</div>
      ${alert.length?`<div class="mut s-r">Rifiutato: ${esc(alert.join(', '))}</div>`:''}
      ${nt?`<div class="mut s-g">📞 Contatto fissato ${fd(nt.date)}${nt.time?' '+nt.time:''}</div>`:''}</div><span class="go">›</span></div>`; }).join('') : '<div class="empty">Nessun cliente corrisponde.</div>'}</div></div>`;
}
function resAction(cid){
  const c=client(cid);
  openModal(mh(esc(cname(c)))+`<div class="choice">
    <button class="btn ok" onclick="closeModal();bookForm({type:'tel',types:['tel'],clientId:${q(cid)},lockClient:true})">📞 Fissa contatto telefonico</button>
    <button class="btn sec" onclick="closeModal();go('client',{id:${q(cid)},tab:'prod'})">👤 Apri scheda cliente</button></div>`);

function pkRedraw(){ const sh=document.querySelector('#modals .ov:last-child .sheet'); const y=sh?sh.scrollTop:0; replaceModal(pkHtml()); const n=document.querySelector('#modals .ov:last-child .sheet'); if(n) n.scrollTop=y; }

VIEWS.saved = () => hdr('Ricerche salvate') + `<div class="wrap"><div class="card"><div class="list">${db.searches.length? [...db.searches].reverse().map(s=>`<div class="it" onclick="go('search',{id:${q(s.id)}})"><div class="grow"><div class="t">${esc(s.name)}</div><div class="mut">${fd(s.created)} · ${runSearch(s.crit).length} clienti</div></div><span class="go">›</span></div>`).join('') : '<div class="empty">Nessuna ricerca salvata.</div>'}</div></div></div>`;
VIEWS.search = s => {
  const ss=db.searches.find(x=>x.id===s.id); if(!ss) return hdr('Ricerca')+'<div class="wrap empty">Ricerca eliminata.</div>';
  return hdr(esc(ss.name)) + `<div class="wrap"><div class="card"><div class="mut">Salvata il ${fd(ss.created)} — i risultati sono sempre aggiornati.</div>
    ${Object.keys(CRIT).filter(k=>ss.crit[k].length).map(k=>`<div style="margin-top:8px"><span class="badge ${k==='own'?'b-done':k==='neg'?'b-wait':''}">${CRIT[k].l}</span> ${ss.crit[k].map(id=>esc(pathLabel(id))).join(', ')}</div>`).join('')}
    <div class="row" style="margin-top:12px"><button class="btn sm del" onclick="confirmBox('Eliminare la ricerca salvata?',()=>{db.searches=db.searches.filter(x=>x.id!==${q(ss.id)});save();back();})">Elimina</button></div></div>
    ${resultsHtml(ss.crit, ss.id)}</div>`;
};
function pdfSearch(savedId){
  const ss = savedId ? db.searches.find(x=>x.id===savedId) : null;
  const cr = ss ? ss.crit : PS; const r = runSearch(cr);
  const blob = makePdf({
    title: ss ? ss.name : 'Ricerca prodotti',
    sub: 'Creato il '+fd(today())+'  -  '+r.length+' clienti',
    info: critText(cr),
    head: ['#','Cognome e nome','NDG','Cellulare','Email','Note'],
    widths: [22,140,62,82,120,97],
    rows: r.map(({c,alert},i)=>[String(i+1), cname(c)+(c.prospect?' (P)':''), c.ndg||'', c.cell||'', c.email||'', alert.length?'! Rifiutato: '+alert.join(', '):''])
  });
  const name=((ss?ss.name:'ricerca')+'_'+today()).replace(/[^\w\-]+/g,'_')+'.pdf';
  downloadBlob(blob, name); toast('PDF creato');
}
function downloadBlob(blob, name){
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
}
/* Generatore PDF minimo (A4, Helvetica) – nessuna libreria esterna, funziona offline */
function makePdf(o){
  const W=595, H=842, M=36, pages=[]; let cs='', y=0;
  const enc = t => String(t).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/[^\x20-\xff]/g,'?').replace(/[\\()]/g,m=>'\\'+m);
  const cw = ch => /[A-Z]/.test(ch)?0.68 : /[a-z]/.test(ch)?0.53 : /[0-9]/.test(ch)?0.556 : ch===' '?0.278 : /[.,:;'!|il]/.test(ch)?0.28 : 0.6;
  const tw = (t,sz) => [...String(t)].reduce((a,ch)=>a+cw(ch),0)*sz;
  const wrap = (t,w,sz) => { const out=[]; let line='';
    String(t).split(/\s+/).forEach(word=>{ const test=line?line+' '+word:word;
      if(tw(test,sz)<=w) line=test; else { if(line) out.push(line); line=word; while(tw(line,sz)>w && line.length>1){ let k=line.length; while(k>1&&tw(line.slice(0,k),sz)>w) k--; out.push(line.slice(0,k)); line=line.slice(k);} } });
    if(line) out.push(line); return out.length?out:['']; };
  const txt = (x,yy,t,sz,bold,col) => { cs+=`BT ${col||'0.11 0.14 0.19'} rg /${bold?'F2':'F1'} ${sz} Tf ${x.toFixed(1)} ${yy.toFixed(1)} Td (${enc(t)}) Tj ET\n`; };
  const rect = (x,yy,w,h,col) => { cs+=`${col} rg ${x} ${yy.toFixed(1)} ${w} ${h.toFixed(1)} re f\n`; };
  const newPage = () => { if(cs) pages.push(cs); cs=''; y=H-M; };
  const header = () => { rect(M,y-16,W-2*M,18,'0.12 0.23 0.37'); let x=M; o.head.forEach((h,i)=>{ txt(x+4,y-11.5,h,8.5,true,'1 1 1'); x+=o.widths[i]; }); y-=20; };
  newPage();
  txt(M,y-14,o.title,17,true,'0.12 0.23 0.37'); y-=30;
  txt(M,y,o.sub,9,false,'0.42 0.46 0.52'); y-=14;
  wrap(o.info,W-2*M,8.5).forEach(l=>{ txt(M,y,l,8.5,false); y-=11; }); y-=8;
  header();
  o.rows.forEach((row,ri)=>{
    const cells=row.map((c,i)=>wrap(c,o.widths[i]-8,8.5));
    const h=Math.max(...cells.map(c=>c.length))*10.5+6;
    if(y-h<M){ newPage(); header(); }
    if(ri%2) rect(M,y-h,W-2*M,h,'0.95 0.96 0.97');
    let x=M; cells.forEach((lines,i)=>{ lines.forEach((l,k)=>txt(x+4,y-11-k*10.5,l,8.5,i===1,i===5?'0.82 0.24 0.24':null)); x+=o.widths[i]; });
    y-=h;
  });
  if(!o.rows.length) txt(M,y-14,'Nessun cliente corrisponde ai criteri.',10,false);
  pages.push(cs);
  // assemblaggio
  const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
  add('<< /Type /Catalog /Pages 2 0 R >>'); add('');
  const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  const f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const kids=[];
  pages.forEach((c,i)=>{ c+=`BT 0.6 0.6 0.6 rg /F1 7.5 Tf ${W-M-40} 20 Td (Pag. ${i+1}/${pages.length}) Tj ET\n`;
    const sid=add(`<< /Length ${c.length} >>\nstream\n${c}endstream`);
    kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >> >> /Contents ${sid} 0 R >>`)); });
  objs[1]=`<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
  let out='%PDF-1.4\n%\xe2\xe3\xcf\xd3\n'; const off=[];
  objs.forEach((s,i)=>{ off.push(out.length); out+=`${i+1} 0 obj\n${s}\nendobj\n`; });
  const xref=out.length;
  out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('');
  out+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const bytes=new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
  return new Blob([bytes],{type:'application/pdf'});
}

/* ---------- 4) TASK ---------- */
function activeTasks(c){ return c.tasks.filter(t=>!t.done); }
function dueTasks(){
  const t=today(); const out=[];
  db.collabs.forEach(c=>c.tasks.forEach(k=>{ if(!k.done && k.due && diffDays(k.due,t)<=3) out.push({c,t:k}); }));
  return out.sort((a,b)=>a.t.due.localeCompare(b.t.due));
}
function dueLabel(d){
  const n=diffDays(d,today());
  if(n<0) return `<span class="due-late">Scaduta il ${fd(d)} (${-n} gg fa)</span>`;
  if(n===0) return `<span class="due-late">Scade oggi</span>`;
  if(n<=3) return `<span class="due-soon">Scade ${n===1?'domani':'tra '+n+' giorni'} (${fd(d)})</span>`;
  return 'Scadenza '+fd(d);
}
VIEWS.tasks = () => hdr('Task') + `<div class="wrap">
  ${db.collabs.length? db.collabs.map(c=>{ const n=activeTasks(c).length; return `<button class="taskbtn" onclick="go('collab',{id:${q(c.id)}})">👤 ${esc(c.name)}<span class="n ${n?'':'z'}">${n}</span></button>`; }).join('') : '<div class="card empty">Nessun collaboratore. Aggiungine uno.</div>'}
  </div><button class="btn fab" onclick="collabForm()">＋ COLLABORATORE</button>`;
function collabForm(id){
  const c=id?db.collabs.find(x=>x.id===id):{name:''};
  openModal(mh(id?'Modifica collaboratore':'Nuovo collaboratore')+`<label class="f">Nome <b>*</b></label><input type="text" id="coN" data-af value="${esc(c.name)}">
    <div class="acts">${id?`<button class="btn del" onclick="confirmBox('Eliminare il collaboratore e tutte le sue task?',()=>{db.collabs=db.collabs.filter(x=>x.id!==${q(id)});save();closeAllModals(true);back();})">Elimina</button>`:''}
    <button class="btn" onclick="(function(){const n=val('coN');if(!n)return toast('Indica il nome');${id?`db.collabs.find(x=>x.id===${q(id)}).name=n`:`db.collabs.push({id:uid(),name:n,tasks:[]})`};save();closeModal();render();})()">Salva</button></div>`);
}
VIEWS.collab = s => {
  const c=db.collabs.find(x=>x.id===s.id); if(!c) return hdr('Task')+'<div class="wrap empty">Collaboratore eliminato.</div>';
  const ts=[...c.tasks].sort((a,b)=> (a.done-b.done) || String(a.due).localeCompare(String(b.due)));
  return hdr(esc(c.name), {right:`<button class="ib" onclick="collabForm(${q(c.id)})" aria-label="Modifica">✎</button>`}) + `<div class="wrap">
    <div class="card"><h3>Task attive <span class="cnt">${activeTasks(c).length}</span></h3>
    ${ts.length? ts.map(t=>`<div class="task ${t.done?'done':''}"><button class="chk" onclick="taskTog(${q(c.id)},${q(t.id)})" aria-label="Eseguito">${t.done?'✓':''}</button>
      <div class="grow"><div class="tt">${esc(t.text)}</div>
      <div class="ds">Assegnata ${fd(t.assigned)} · ${t.done?'<span class="s-g">Eseguita il '+fd(t.doneDate)+'</span>':dueLabel(t.due)}</div></div>
      <button class="icb" onclick="taskForm(${q(c.id)},${q(t.id)})">✎</button><button class="icb" onclick="confirmBox('Eliminare la task?',()=>{const c=db.collabs.find(x=>x.id===${q(c.id)});c.tasks=c.tasks.filter(x=>x.id!==${q(t.id)});save();render();})">🗑</button></div>`).join('') : '<div class="empty">Nessuna task.</div>'}
    </div></div><button class="btn fab" onclick="taskForm(${q(c.id)})">＋ NUOVA TASK</button>`;
};
function taskForm(cid, tid){
  const c=db.collabs.find(x=>x.id===cid); const t=tid?c.tasks.find(x=>x.id===tid):{text:'',assigned:today(),due:''};
  openModal(mh(tid?'Modifica task':'Nuova task per '+esc(c.name))+`
    <label class="f">Task <b>*</b></label><textarea id="tkT" data-af>${esc(t.text)}</textarea>
    <div class="row"><div class="grow"><label class="f">Assegnazione</label><input type="date" id="tkA" value="${t.assigned}"></div>
    <div class="grow"><label class="f">Data ultima <b>*</b></label><input type="date" id="tkD" value="${t.due}"></div></div>
    <div class="acts"><button class="btn" onclick="saveTask(${q(cid)},${tid?q(tid):'null'})">Salva</button></div>`);
}
function saveTask(cid,tid){
  const text=val('tkT'), due=val('tkD'), as=val('tkA')||today();
  if(!text) return toast('Descrivi la task'); if(!due) return toast('Indica la data ultima');
  const c=db.collabs.find(x=>x.id===cid);
  if(tid) Object.assign(c.tasks.find(x=>x.id===tid), {text, due, assigned:as});
  else c.tasks.push({id:uid(), text, assigned:as, due, done:false});
  save(); closeModal(); render();
}
function taskTog(cid,tid){ const t=db.collabs.find(x=>x.id===cid).tasks.find(x=>x.id===tid); t.done=!t.done; t.doneDate=t.done?today():null; save(); render(); }

/* ---------- EXPORT / IMPORT / BACKUP DOMENICALE ---------- */
function backupModal(sunday){
  openModal(mh(sunday?'💾 Backup della domenica':'Export / Import')+`
    ${sunday?'<p>È domenica: salva il backup settimanale dei tuoi dati sul telefono.</p>':''}
    <p class="mut">Ultimo backup: <b>${db.meta.lastBackup?fd(db.meta.lastBackup):'mai'}</b>. I dati sono solo su questo telefono: conserva il file di backup (es. in Download o su Drive).</p>
    <div class="choice"><button class="btn ok" onclick="doExport()">⬇ EXPORT – scarica backup</button>
    ${sunday?'':`<button class="btn sec" onclick="$('fileImp').click()">⬆ IMPORT – ripristina da file</button>
      <button class="btn sec" onclick="restoreInternal()">↺ Ripristina ultimo job backup${db.meta.lastDayBackup?' ('+fd(ds(new Date(db.meta.lastDayBackup)))+')':''}</button>`}</div>
    <p class="mut" style="font-size:12px">Il <b>job backup</b> si aggiorna da solo a ogni CHIUDI GIORNATA: viene scaricato il file “job backup.json” e ne resta una copia anche dentro l'app.</p>
    <p class="mut" style="font-size:12px;margin-top:12px">${db.clients.length} clienti · ${db.events.length} impegni · ${db.collabs.length} collaboratori · ${db.searches.length} ricerche salvate</p>`);
}
function backupText(){ return JSON.stringify({app:'JOB', version:1, exported:new Date().toISOString(), db}, null, 1); }
function doExport(){
  downloadBlob(new Blob([backupText()],{type:'application/json'}), 'JOB_backup_'+today()+'.json');
  db.meta.lastBackup=today(); save(); closeModal(); render(); toast('Backup scaricato');
}
const BKEY = 'job_backup'; // copia "job backup" interna all'app, sovrascritta a ogni chiusura
function finishDay(){
  db.meta.lastClosed=today(); db.meta.lastBackup=today(); db.meta.lastDayBackup=new Date().toISOString(); save();
  const txt = backupText();
  try{ localStorage.setItem(BKEY, txt); }catch(e){}
  downloadBlob(new Blob([txt],{type:'application/json'}), 'job backup.json');
  render(); toast('Giornata chiusa 🌙 – job backup aggiornato');
}
function restoreInternal(){
  let txt=null; try{ txt=localStorage.getItem(BKEY); }catch(e){}
  if(!txt) return alertBox('Nessun job backup interno disponibile.');
  restoreData(txt);
}
function restoreData(txt){
  try{
    const j=JSON.parse(txt); const d=j.db||j;
    if(!Array.isArray(d.clients)||!Array.isArray(d.events)) throw 0;
    confirmBox(`Il backup${j.exported?' del '+fd(ds(new Date(j.exported))):''} contiene ${d.clients.length} clienti e ${d.events.length} impegni. Sostituire TUTTI i dati attuali?`, ()=>{
      db=d; const b=blank(); for(const k in b) if(db[k]==null) db[k]=b[k];
      save(); closeAllModals(true); stack=[{v:'home'}]; render(); toast('Dati ripristinati');
    }, 'Sostituisci');
  }catch(e){ alertBox('File non valido: non è un backup di JOB.'); }
}
$('fileImp').addEventListener('change', ev=>{
  const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>restoreData(rd.result);
  rd.readAsText(f);
});

/* ===================== AVVIO ===================== */
load();
history.replaceState({d:1},'');
render();
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
function startupChecks(){
  if(pendingPast().length && !modals.some(m=>m.locked)) chiudiGiornata(true);
  else if(new Date().getDay()===0 && db.meta.lastBackup!==today() && db.meta.sundayAsked!==today()){
    db.meta.sundayAsked=today(); save(); backupModal(true);
  }
}
startupChecks();
// se l'app resta aperta oltre la mezzanotte o torna in primo piano
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ render(); startupChecks(); } });
</script>
